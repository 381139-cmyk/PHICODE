<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Breakout Arcade | 打磚塊街機遊戲</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        arcade: ['Courier New', 'monospace']
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #090d16;
            color: #f3f4f6;
            user-select: none;
            overflow-x: hidden;
        }
        .neon-border {
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5), inset 0 0 15px rgba(59, 130, 246, 0.2);
        }
        .neon-text {
            text-shadow: 0 0 10px rgba(59, 130, 246, 0.8), 0 0 20px rgba(59, 130, 246, 0.4);
        }
        .neon-text-pink {
            text-shadow: 0 0 10px rgba(236, 72, 153, 0.8), 0 0 20px rgba(236, 72, 153, 0.4);
        }
        #gameCanvas {
            background: radial-gradient(circle at center, #111827 0%, #030712 100%);
            touch-action: none;
            display: block;
        }
        .arcade-btn {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
        }
        .arcade-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.6);
        }
        .arcade-btn:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-2 sm:p-4">

    <!-- Header / HUD Bar -->
    <header class="w-full max-w-4xl bg-slate-900/80 backdrop-blur-md border border-slate-800 rounded-2xl p-3 sm:p-4 shadow-2xl flex flex-wrap items-center justify-between gap-4 mb-3">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-blue-600/20 border border-blue-500/50 flex items-center justify-center text-blue-400 font-bold text-xl neon-text">
                <i class="fa-solid fa-gamepad"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg sm:text-xl tracking-wider text-white neon-text">NEON BREAKOUT</h1>
                <p class="text-xs text-slate-400">Classic Arcade Edition</p>
            </div>
        </div>

        <!-- Stats Container -->
        <div class="flex items-center gap-3 sm:gap-6 text-sm font-arcade">
            <div class="bg-slate-800/80 border border-slate-700/60 px-3 py-1.5 rounded-xl flex flex-col items-center">
                <span class="text-xs text-slate-400 uppercase">Score</span>
                <span id="scoreVal" class="text-amber-400 font-bold text-base sm:text-lg">0</span>
            </div>
            <div class="bg-slate-800/80 border border-slate-700/60 px-3 py-1.5 rounded-xl flex flex-col items-center">
                <span class="text-xs text-slate-400 uppercase">Lives</span>
                <span id="livesVal" class="text-rose-400 font-bold text-base sm:text-lg">3</span>
            </div>
            <div class="bg-slate-800/80 border border-slate-700/60 px-3 py-1.5 rounded-xl flex flex-col items-center">
                <span class="text-xs text-slate-400 uppercase">Level</span>
                <span id="levelVal" class="text-emerald-400 font-bold text-base sm:text-lg">1</span>
            </div>
            <div class="bg-slate-800/80 border border-slate-700/60 px-3 py-1.5 rounded-xl flex flex-col items-center hidden sm:flex">
                <span class="text-xs text-slate-400 uppercase">High Score</span>
                <span id="highScoreVal" class="text-purple-400 font-bold text-base sm:text-lg">0</span>
            </div>
        </div>

        <!-- Controls Buttons Top Right -->
        <div class="flex items-center gap-2">
            <button id="pauseBtn" onclick="togglePause()" class="w-10 h-10 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 flex items-center justify-center text-slate-300 transition" title="Pause / Resume">
                <i class="fa-solid fa-pause" id="pauseIcon"></i>
            </button>
            <button onclick="toggleMute()" id="soundBtn" class="w-10 h-10 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 flex items-center justify-center text-slate-300 transition" title="Toggle Sound">
                <i class="fa-solid fa-volume-high" id="soundIcon"></i>
            </button>
            <button onclick="openInfoModal()" class="w-10 h-10 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 flex items
